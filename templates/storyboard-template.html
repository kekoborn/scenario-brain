<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сториборд — PROJECT_TITLE_PLACEHOLDER</title>
<style>
  :root{--bg:#0c0c10;--card:#16161c;--line:#26262f;--ink:#ececf0;
    --muted:#8a8a96;--accent:#a78bfa;--accent2:#7c5cff;--star:#facc15;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    padding-bottom:40px}
  .wrap{max-width:1100px;margin:0 auto;padding:28px 20px}
  h1{font-size:25px;margin:0 0 4px;letter-spacing:-.02em}
  .sub{color:var(--muted);margin-bottom:18px}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
  .filters button{background:var(--card);color:var(--muted);border:1px solid var(--line);
    border-radius:99px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
  .filters button.active{background:var(--accent2);color:#fff;border-color:var(--accent2)}
  .blockhead{margin:26px 0 10px;font-size:13px;text-transform:uppercase;
    letter-spacing:.08em;color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .frame{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;display:flex;flex-direction:column;gap:9px}
  .frame.star{border-color:#5b4aa0;box-shadow:0 0 0 1px #5b4aa0 inset}
  .frame .id{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .frame .code{font-weight:700;font-size:12px;background:#23232c;color:var(--accent);
    border-radius:6px;padding:2px 8px;font-variant-numeric:tabular-nums}
  .frame .time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .frame .pat{font-size:11px;color:#fff;background:var(--accent2);border-radius:5px;
    padding:1px 7px;margin-left:auto}
  .frame .star-badge{color:var(--star);font-size:13px}
  .frame .phrase{font-size:15px;font-weight:600;line-height:1.45}
  .frame .row{font-size:13px;color:var(--muted)}
  .frame .row b{color:var(--ink);font-weight:600}
  .frame .art{font-size:12px;color:var(--star);background:#231f10;
    border:1px solid #3a3413;border-radius:8px;padding:6px 10px}
  .legend{color:var(--muted);font-size:12px;margin:10px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>Сториборд — PROJECT_TITLE_PLACEHOLDER</h1>
  <div class="sub">PROJECT_SUBTITLE_PLACEHOLDER</div>
  <div class="filters" id="filters"></div>
  <div id="board"></div>
  <p class="legend">Паттерны: A — говорящая голова · B — текст/списки · C — таблицы/данные · D — B-roll · E — 2D/3D · F — AI/премиум</p>
</div>
<script>
const FRAMES = FRAMES_DATA_PLACEHOLDER;

const blocks=[...new Set(FRAMES.map(f=>f.block))];
let active="all";

function renderFilters(){
  const f=document.getElementById("filters");
  const mk=(v,l)=>`<button data-f="${v}" class="${active===v?'active':''}">${l}</button>`;
  f.innerHTML=mk("all","Все блоки")+mk("star","⭐ Ключевые")+
    blocks.map(b=>mk(String(b),"Блок "+b)).join("");
  f.querySelectorAll("button").forEach(b=>b.onclick=()=>{active=b.dataset.f;renderFilters();renderBoard();});
}

function renderBoard(){
  const board=document.getElementById("board");
  let list=FRAMES;
  if(active==="star") list=FRAMES.filter(f=>f.star);
  else if(active!=="all") list=FRAMES.filter(f=>f.block===+active);
  board.innerHTML="";
  let curBlock=null;
  list.forEach(f=>{
    if(f.block!==curBlock){
      curBlock=f.block;
      const hd=document.createElement("div");
      hd.className="blockhead";
      const title=FRAMES.find(x=>x.block===f.block&&x.bt)?.bt||("Блок "+f.block);
      hd.textContent="Блок "+f.block+" · "+title;
      board.appendChild(hd);
      const grid=document.createElement("div");grid.className="grid";grid.id="g"+f.block;
      board.appendChild(grid);
    }
    const g=document.getElementById("g"+f.block);
    const card=document.createElement("div");
    card.className="frame"+(f.star?" star":"");
    card.innerHTML=`
      <div class="id">
        <span class="code">${f.id}</span>
        <span class="time">${f.time}</span>
        ${f.star?'<span class="star-badge">⭐</span>':''}
        <span class="pat">${f.pat}</span>
      </div>
      <div class="phrase">${f.phrase}</div>
      <div class="row"><b>Кадр:</b> ${f.shot}</div>
      ${f.anim?`<div class="row"><b>Анимация:</b> ${f.anim}</div>`:''}
      ${f.ref?`<div class="row"><b>Референс:</b> ${f.ref}</div>`:''}
      ${f.art?`<div class="art">📦 Артефакт: ${f.art}</div>`:''}`;
    g.appendChild(card);
  });
}
renderFilters();renderBoard();
</script>
</body>
</html>
